
# develop 또는 main 브랜치로 PR 생성 시 빌드 테스트 진행
name: PR Build and Test

on:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 저장소 checkout
      - name: Checkout code
        uses: actions/checkout@v6

      # pnpm 설치
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      # Node.js 환경 설정
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # 의존성 설치
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ESLint 검사
      - name: Run ESLint
        run: pnpm lint

      # 빌드 테스트
      - name: Build project
        run: pnpm build
